<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes pulse { 0%,100%{opacity:.18} 50%{opacity:.38} }
      @keyframes float1 { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
      @keyframes float2 { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-4px)} }
      @keyframes scan { 0%{transform:translateY(0)} 100%{transform:translateY(120px)} }
      @keyframes blink { 0%,100%{opacity:1} 48%,52%{opacity:0} }
      @keyframes drift { 0%{opacity:0;transform:translateX(0)} 10%{opacity:.7} 90%{opacity:.7} 100%{opacity:0;transform:translateX(18px)} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      .shield-pulse { animation: pulse 3s ease-in-out infinite; }
      .shield-float { animation: float1 4s ease-in-out infinite; transform-origin: 340px 110px; }
      .mini-float { animation: float2 5s ease-in-out infinite 0.5s; }
      .scan-line { animation: scan 2.2s linear infinite; }
      .blink-cursor { animation: blink 1s step-end infinite; }
      .particle { animation: drift 3s linear infinite; }
      .fadein { animation: fadeIn 1s ease-out both; }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="680" height="220" fill="#0d1117" rx="12"/>

  <!-- Grid lines subtle -->
  <g opacity="0.07" stroke="#7f77dd" stroke-width="0.5">
    <line x1="0" y1="44" x2="680" y2="44"/>
    <line x1="0" y1="88" x2="680" y2="88"/>
    <line x1="0" y1="132" x2="680" y2="132"/>
    <line x1="0" y1="176" x2="680" y2="176"/>
    <line x1="136" y1="0" x2="136" y2="220"/>
    <line x1="272" y1="0" x2="272" y2="220"/>
    <line x1="408" y1="0" x2="408" y2="220"/>
    <line x1="544" y1="0" x2="544" y2="220"/>
  </g>

  <!-- Glow halo behind shield -->
  <ellipse class="shield-pulse" cx="160" cy="112" rx="78" ry="82" fill="#534ab7" opacity="0.18"/>
  <ellipse class="shield-pulse" cx="160" cy="112" rx="55" ry="58" fill="#7f77dd" opacity="0.15" style="animation-delay:.8s"/>

  <!-- Shield body (floating) -->
  <g class="shield-float">
    <path d="M160 44 L206 62 L206 108 Q206 148 160 170 Q114 148 114 108 L114 62 Z" fill="#1e1b3a" stroke="#7f77dd" stroke-width="1.5"/>
    <path d="M160 54 L198 69 L198 108 Q198 142 160 160 Q122 142 122 108 L122 69 Z" fill="none" stroke="#534ab7" stroke-width="0.8" opacity="0.6"/>
    <clipPath id="shield-clip">
      <path d="M160 44 L206 62 L206 108 Q206 148 160 170 Q114 148 114 108 L114 62 Z"/>
    </clipPath>
    <g clip-path="url(#shield-clip)">
      <rect class="scan-line" x="114" y="44" width="92" height="2" fill="#9f9be8" opacity="0.5"/>
    </g>
    <line x1="145" y1="97" x2="175" y2="127" stroke="#afa9ec" stroke-width="3" stroke-linecap="round"/>
    <line x1="175" y1="97" x2="145" y2="127" stroke="#afa9ec" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="86" r="3" fill="#7f77dd" opacity="0.7"/>
  </g>

  <!-- Particles -->
  <circle class="particle" cx="90" cy="78" r="2" fill="#7f77dd" style="animation-delay:0s"/>
  <circle class="particle" cx="70" cy="130" r="1.5" fill="#534ab7" style="animation-delay:1.1s"/>
  <circle class="particle" cx="50" cy="100" r="1" fill="#afa9ec" style="animation-delay:2s"/>
  <circle class="particle" cx="105" cy="155" r="1.5" fill="#7f77dd" style="animation-delay:0.6s"/>

  <!-- Title -->
  <text class="fadein" x="246" y="86" font-family="'Courier New', monospace" font-size="38" font-weight="700" fill="#eeedfe" letter-spacing="-1" style="animation-delay:.2s">AntiCheatX</text>

  <!-- Subtitle -->
  <text class="fadein" x="246" y="112" font-family="'Courier New', monospace" font-size="13" fill="#afa9ec" letter-spacing="2" style="animation-delay:.5s">PAPER MINECRAFT ANTI-CHEAT PLUGIN</text>

  <!-- Divider -->
  <line x1="246" y1="122" x2="620" y2="122" stroke="#534ab7" stroke-width="0.8" opacity="0.6"/>

  <!-- Feature tags -->
  <g class="fadein" style="animation-delay:.7s">
    <rect x="246" y="132" width="84" height="22" rx="4" fill="#1e1b3a" stroke="#534ab7" stroke-width="0.8"/>
    <text x="288" y="147" font-family="'Courier New', monospace" font-size="10" fill="#9f9be8" text-anchor="middle">Fly Detection</text>
    <rect x="338" y="132" width="84" height="22" rx="4" fill="#1e1b3a" stroke="#534ab7" stroke-width="0.8"/>
    <text x="380" y="147" font-family="'Courier New', monospace" font-size="10" fill="#9f9be8" text-anchor="middle">Speed Hacks</text>
    <rect x="430" y="132" width="72" height="22" rx="4" fill="#1e1b3a" stroke="#534ab7" stroke-width="0.8"/>
    <text x="466" y="147" font-family="'Courier New', monospace" font-size="10" fill="#9f9be8" text-anchor="middle">X-Ray Check</text>
    <rect x="510" y="132" width="82" height="22" rx="4" fill="#1e1b3a" stroke="#534ab7" stroke-width="0.8"/>
    <text x="551" y="147" font-family="'Courier New', monospace" font-size="10" fill="#9f9be8" text-anchor="middle">KillAura Guard</text>
  </g>

  <!-- Badges -->
  <g class="fadein" style="animation-delay:.9s">
    <rect x="246" y="168" width="56" height="18" rx="3" fill="#3c3489"/>
    <text x="274" y="181" font-family="'Courier New', monospace" font-size="10" fill="#eeedfe" text-anchor="middle">v1.0.0</text>
    <rect x="310" y="168" width="52" height="18" rx="3" fill="#993c1d"/>
    <text x="336" y="181" font-family="'Courier New', monospace" font-size="10" fill="#faece7" text-anchor="middle">Paper</text>
    <rect x="370" y="168" width="68" height="18" rx="3" fill="#0f6e56"/>
    <text x="404" y="181" font-family="'Courier New', monospace" font-size="10" fill="#e1f5ee" text-anchor="middle">MC 1.21.1</text>
    <rect x="446" y="168" width="56" height="18" rx="3" fill="#185fa5"/>
    <text x="474" y="181" font-family="'Courier New', monospace" font-size="10" fill="#e6f1fb" text-anchor="middle">Java 21+</text>
    <rect x="510" y="168" width="46" height="18" rx="3" fill="#444441"/>
    <text x="533" y="181" font-family="'Courier New', monospace" font-size="10" fill="#f1efe8" text-anchor="middle">MIT</text>
  </g>

  <!-- Credit -->
  <text class="fadein" x="246" y="206" font-family="'Courier New', monospace" font-size="10" fill="#5f5e5a" style="animation-delay:1.1s">Made by Chamika Samaraweera · teaminfinity.lk</text>

  <!-- Blinking cursor -->
  <rect class="blink-cursor fadein" x="597" y="196" width="6" height="11" fill="#7f77dd" rx="1" style="animation-delay:1.1s"/>
</svg>
